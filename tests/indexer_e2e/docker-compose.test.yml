# Docker Compose override for indexer end-to-end tests.
# Usage: docker compose -f docker-compose.yml -f tests/indexer_e2e/docker-compose.test.yml up --wait

services:
  stellar-node:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: votechain
      POSTGRES_PASSWORD: votechain
      POSTGRES_DB: votechain_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votechain"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  indexer-e2e:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://votechain:votechain@postgres:5432/votechain_test
      STELLAR_RPC_URL: http://stellar-node:8000
      NETWORK_PASSPHRASE: "Standalone Network ; February 2021"
    depends_on:
      stellar-node:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["cargo", "test", "-p", "votechain-indexer", "--", "--ignored", "test_proposal_lifecycle_events_indexed"]
    volumes:
      - .:/app
      - /app/target
    working_dir: /app
