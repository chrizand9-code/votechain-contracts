name: Indexer E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'indexer/**'
      - 'contracts/**'
      - 'tests/indexer_e2e/**'
      - '.github/workflows/indexer-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'indexer/**'
      - 'contracts/**'
      - 'tests/indexer_e2e/**'
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  indexer-e2e:
    name: Indexer End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Run indexer E2E tests
        run: bash tests/indexer_e2e/e2e_test.sh
